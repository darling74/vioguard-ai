services:
  - type: web
    name: vioguard-ai
    runtime: python
    plan: standard
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python download_model.py
    startCommand: python app.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DEVICE
        value: cpu
      - key: FLASK_DEBUG
        value: "false"
      - key: MODEL_PRELOAD
        value: "false"
      - key: MAX_UPLOAD_MB
        value: "100"
